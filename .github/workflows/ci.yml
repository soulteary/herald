name: CI

# NOTE: This repository currently uses local `replace` directives in go.mod
# pointing at sibling `../kits/*` sources during the security-hardening work.
# CI `go mod download` / `go build` will only succeed once those kit fixes are
# released and go.mod is re-pinned to tagged versions (see docs migration notes).
# Until then, the module-download steps below are expected to fail on a clean
# checkout and this is documented, not a silent skip.

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Least privilege by default; individual jobs opt into more only if needed.
permissions:
  contents: read

env:
  DOCKER_BUILDKIT: 1
  # Pinned tool versions (do not use "latest" so runs are reproducible).
  GOLANGCI_LINT_VERSION: v2.13.0
  # v1.1.4 pins golang.org/x/tools@v0.29.0 whose SSA builder panics on Go 1.27
  # AST nodes ("unexpected expr: *ast.KeyValueExpr"). v1.7.0 supports Go 1.27.
  GOVULNCHECK_VERSION: v1.7.0

jobs:
  fmt:
    name: Code Formatting Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: 'go.mod'
      - name: Check code formatting
        run: |
          if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then
            echo "The following files have incorrect formatting:"
            gofmt -s -d .
            exit 1
          fi

  vet:
    name: Code Static Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: 'go.mod'
      - name: Download dependencies
        run: go mod download
      - name: Run go vet
        run: go vet ./...

  test:
    name: Code Testing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: 'go.mod'
      - name: Download dependencies
        run: go mod download
      - name: Run tests (race + coverage)
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...
      - name: Display coverage summary
        run: go tool cover -func=coverage.out
      - name: Enforce coverage floor
        run: |
          TOTAL=$(go tool cover -func=coverage.out | awk '/^total:/ {gsub("%", "", $3); print $3}')
          echo "total coverage: ${TOTAL}% (required: 74.0%)"
          awk -v total="$TOTAL" 'BEGIN { if (total + 0 < 74.0) exit 1 }'
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@671740ac38dd9b0130fbe1cec585b89eea48d3de # v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.out
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  lint:
    name: Code Quality Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: 'go.mod'
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@1e7e51e771db61008b38414a730f564565cf7c20 # v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          args: --timeout=5m
          only-new-issues: false

  security-scan:
    name: Dependency Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: 'go.mod'
      - name: Download dependencies
        run: go mod download
      - name: Install govulncheck (pinned)
        run: go install golang.org/x/vuln/cmd/govulncheck@${{ env.GOVULNCHECK_VERSION }}
      - name: Run govulncheck
        run: govulncheck ./...

  docker-build:
    name: Docker Build + Scan
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3
      - name: Get version information
        id: version
        run: |
          VERSION=$(git describe --tags --abbrev=0 2>/dev/null || echo "dev-$(git rev-parse --short HEAD)")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Build Docker image
        uses: docker/build-push-action@ca877d9245402d1537745e0e356eab47c3520991 # v6
        with:
          context: .
          file: ./docker/Dockerfile
          push: false
          load: true
          tags: herald:test
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Assert image runs as non-root
        run: |
          UID_OUT=$(docker run --rm --entrypoint id herald:test -u)
          echo "container uid: $UID_OUT"
          if [ "$UID_OUT" = "0" ]; then
            echo "ERROR: image runs as root (uid 0)"; exit 1
          fi
      - name: Generate SBOM (SPDX)
        uses: anchore/sbom-action@f325610c9f50a54015d37c8d16cb3b0e2c8f4de0 # v0
        with:
          image: herald:test
          format: spdx-json
          output-file: sbom.spdx.json
      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sbom
          path: sbom.spdx.json
      - name: Container vulnerability scan (Trivy)
        uses: aquasecurity/trivy-action@dc5a429b52fcf669ce959baa2c2dd26090d2a6c4 # 0.32.0
        with:
          image-ref: herald:test
          format: table
          exit-code: '1'          # block HIGH/CRITICAL vulnerabilities
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          # Pin a Trivy version whose release assets exist. The action's own
          # default (v0.64.1) — plus v0.66.0/v0.68.0 — have had their Linux
          # binaries yanked upstream, so setup-trivy resolves the tag then dies
          # with a bare "exit code 1" on the missing asset download
          # (aquasecurity/trivy-action#516). v0.74.0 assets are present.
          version: v0.74.0
          # Authenticate setup-trivy's GitHub API/download calls to avoid the
          # anonymous shared-IP rate limiting that can also surface as exit 1.
          token-setup-trivy: ${{ secrets.GITHUB_TOKEN }}
          cache: true

  compose-smoke:
    name: Compose Smoke + Config Startup Failure
    runs-on: ubuntu-latest
    needs: [docker-build]
    env:
      REDIS_PASSWORD: ci_redis_password_0123456789012345
      HERALD_API_KEY: ci_api_key_012345678901234567890123
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Validate compose config
        run: docker compose config >/dev/null
      - name: Config-startup-failure test (prod without auth must refuse)
        run: |
          set +e
          OUT=$(docker run --rm -e ENVIRONMENT=production -e API_KEY= -e HMAC_SECRET= \
            herald:test 2>&1)
          CODE=$?
          echo "$OUT"
          if [ "$CODE" -eq 0 ]; then
            echo "ERROR: production started with no auth configured"; exit 1
          fi
          echo "OK: production refused to start without auth (exit $CODE)"
      - name: Compose smoke test (bring up, probe /livez, tear down)
        run: |
          export REDIS_PASSWORD=ci_redis_pw
          export HERALD_API_KEY=ci_api_key_012345678901234567890123
          export HERALD_HMAC_SECRET=ci_hmac_secret_value
          docker compose up -d
          # Wait for the herald container to become healthy.
          for i in $(seq 1 30); do
            STATUS=$(docker inspect --format '{{ .State.Health.Status }}' "$(docker compose ps -q herald)" 2>/dev/null || echo starting)
            echo "attempt $i: $STATUS"
            [ "$STATUS" = "healthy" ] && break
            sleep 3
          done
          docker compose ps
          docker inspect --format '{{ .State.Health.Status }}' "$(docker compose ps -q herald)" | grep -q healthy
      - name: Tear down
        if: always()
        run: docker compose down -v

  build:
    name: Build Check
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: 'go.mod'
      - name: Download dependencies
        run: go mod download
      - name: Build project
        shell: bash
        run: |
          VERSION=$(git describe --tags --abbrev=0 2>/dev/null || echo "dev-$(git rev-parse --short HEAD)")
          COMMIT=${{ github.sha }}
          BUILD_DATE=$(date +%FT%T%z)
          LDFLAGS="-s -w -X 'github.com/soulteary/version-kit/v2.Version=${VERSION}' -X 'github.com/soulteary/version-kit/v2.Commit=${COMMIT}' -X 'github.com/soulteary/version-kit/v2.BuildDate=${BUILD_DATE}'"
          CGO_ENABLED=0 go build -trimpath -ldflags "${LDFLAGS}" -o herald${{ matrix.os == 'windows-latest' && '.exe' || '' }} ./main.go
