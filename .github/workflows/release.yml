name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: '发布尚无 Release/版本镜像的已存在 v* tag（不支持覆盖或 +build 元数据）'
        required: true
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

concurrency:
  group: release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      # Required for keyless cosign signing via GitHub OIDC.
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}

      - name: Resolve release ref
        id: release
        env:
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          python3 -I -B .github/scripts/release_guard.py resolve \
            --event "$GITHUB_EVENT_NAME" --input-tag "$INPUT_RELEASE_TAG" \
            --ref "$GITHUB_REF" --output "$GITHUB_OUTPUT"

      - name: Refuse existing releases and immutable image versions
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          SOURCE_SHA: ${{ steps.release.outputs.source_sha }}
        run: |
          python3 -I -B .github/scripts/release_guard.py guard \
            --tag "$RELEASE_TAG" --expected-sha "$SOURCE_SHA"

      - name: Set up Go environment
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: 'go.mod'

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: go test -race ./...

      - name: Extract version information
        id: version
        run: |
          test "$(git rev-parse HEAD)" = "${{ steps.release.outputs.source_sha }}"
          git diff --quiet HEAD --
          TAG="${{ steps.release.outputs.tag }}"
          VERSION="${{ steps.release.outputs.version }}"
          COMMIT="${{ steps.release.outputs.source_sha }}"
          BUILD_DATE=$(date -u +%FT%T%z)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "commit=$COMMIT" >> $GITHUB_OUTPUT
          echo "build_date=$BUILD_DATE" >> $GITHUB_OUTPUT

      - name: Build Linux binaries
        run: |
          mkdir -p dist
          VERSION=${{ steps.version.outputs.version }}
          COMMIT=${{ steps.version.outputs.commit }}
          BUILD_DATE=${{ steps.version.outputs.build_date }}
          LDFLAGS="-s -w -X 'github.com/soulteary/version-kit/v4.Version=${VERSION}' -X 'github.com/soulteary/version-kit/v4.Commit=${COMMIT}' -X 'github.com/soulteary/version-kit/v4.BuildDate=${BUILD_DATE}'"
          
          # Other host environments should use the Linux container images.
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags "${LDFLAGS}" -o dist/herald-linux-amd64 ./main.go
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -trimpath -ldflags "${LDFLAGS}" -o dist/herald-linux-arm64 ./main.go

      - name: Generate checksums
        run: |
          cd dist
          # Exclude checksums.txt itself from the manifest. `sha256sum *` globs
          # the whole dir; on a re-run (or because the shell creates the redirect
          # target before globbing) checksums.txt can be swept into its own
          # manifest, producing a self-referential line whose hash never matches
          # the final file — which makes a later `sha256sum -c` report
          # "checksums.txt: FAILED". Hash every artifact EXCEPT the manifest.
          sha256sum $(ls | grep -v '^checksums.txt$') > checksums.txt

      - name: Verify checksums
        run: |
          cd dist
          # Re-verify every artifact against the freshly generated manifest so a
          # truncated/corrupt build cannot be published silently. --ignore-missing
          # tolerates a dir that also holds files not listed in the manifest
          # (e.g. checksums.txt itself, or later-added SBOM/signature files) so
          # the check never fails on an unlisted-but-present file.
          sha256sum -c --ignore-missing checksums.txt

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3

      - name: Login to container registry
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@902fa8ec7d6ecbf8d84d538b9b233a880e428804 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          labels: |
            org.opencontainers.image.revision=${{ steps.release.outputs.source_sha }}
          # 手动触发时 github.ref 为分支，无法从 ref 解析 tag，
          # 因此统一使用 Resolve release ref 步骤得到的 tag/version 生成别名。
          tags: |
            type=semver,pattern={{version}},value=${{ steps.release.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.release.outputs.tag }}
            type=semver,pattern={{major}},value=${{ steps.release.outputs.tag }}
            type=raw,value=latest,enable=${{ steps.release.outputs.stable == 'true' }}

      - name: Verify the guarded full-version image tag
        env:
          METADATA_TAGS: ${{ steps.meta.outputs.tags }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          python3 -I -B .github/scripts/release_guard.py verify-metadata \
            --image "${REGISTRY}/${IMAGE_NAME}" --version "$RELEASE_VERSION"

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@ca877d9245402d1537745e0e356eab47c3520991 # v6
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            COMMIT=${{ steps.version.outputs.commit }}
            BUILD_DATE=${{ steps.version.outputs.build_date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      - name: Install cosign
        uses: sigstore/cosign-installer@d7d6bc7722e3daa8354c50bcb52f4837da5e9b6a # v3

      - name: Keyless-sign the image (Sigstore/Fulcio via OIDC)
        env:
          COSIGN_EXPERIMENTAL: "1"
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          # Sign by immutable digest, not tag, so the signature binds to exact bytes.
          cosign sign --yes "${REGISTRY}/${IMAGE_NAME}@${DIGEST}"

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          STABLE_RELEASE: ${{ steps.release.outputs.stable }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/release-notes.md" <<'EOF'
            ## Changes
            
            See [CHANGELOG](https://github.com/${{ github.repository }}/blob/${{ steps.release.outputs.tag }}/CHANGELOG.md) for details.
            
            ## Downloads
            
            ### Docker Image
            ```bash
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
            ```
            
            ### Binaries
            - Linux AMD64: `herald-linux-amd64`
            - Linux ARM64: `herald-linux-arm64`
            For macOS, Windows, and other environments, use the Linux container image.
            
            ### Checksums
            See `checksums.txt` for SHA256 checksums.
          EOF
          args=("$RELEASE_TAG" dist/herald-linux-amd64 dist/herald-linux-arm64 dist/checksums.txt \
            --repo "$GITHUB_REPOSITORY" --verify-tag --title "Release $RELEASE_TAG" \
            --notes-file "$RUNNER_TEMP/release-notes.md")
          if [ "$STABLE_RELEASE" != true ]; then args+=(--prerelease); fi
          # gh release create fails if another writer created this release;
          # unlike update-or-create actions it never clobbers existing assets.
          gh release create "${args[@]}"

  report_release:
    name: Dispatch verified release reports
    needs: release
    if: github.event_name != 'pull_request' && (startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != ''))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Request reports for the released tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          gh workflow run go-quality-reports.yml --repo "$REPOSITORY" --ref "$DEFAULT_BRANCH" \
            -f "source_ref=refs/tags/$RELEASE_TAG" -f reuse_existing_tag_report=true
